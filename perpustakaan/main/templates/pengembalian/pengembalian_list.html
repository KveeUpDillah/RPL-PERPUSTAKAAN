{% extends 'base.html' %}

{% block content %}
<h1>Data Pengembalian</h1>
<a href="{% url 'pengembalian_tambah' %}">Tambah Pengembalian</a>

<table>
    <tr>
        <th>Peminjaman</th>
        <th>Tanggal Dikembalikan</th>
        <th>Denda</th>
    </tr>

    {% for p in pengembalian %}
    <tr>
        <td>{{ p.peminjaman }}</td>
        <td>{{ p.tanggal_dikembalikan }}</td>
        <td>{{ p.denda }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
