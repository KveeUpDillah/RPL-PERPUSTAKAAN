<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="login-box">

    <h2>Login Perpustakaan</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Login
        </button>
    </form>

    <p>
        Belum punya akun?
        <a href="{% url 'register' %}">
            Daftar sekarang
        </a>
    </p>

</div>

</body>
</html>
