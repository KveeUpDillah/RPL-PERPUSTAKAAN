{% extends 'base.html' %}
{% load static %}

{% block title %}Login — BookAI{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <h1 class="auth-title">Masuk ke BookAI</h1>
      <p class="auth-sub">Selamat datang kembali!</p>
    </div>

    {% if error %}
      <div class="alert alert--error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Username kamu" autofocus required />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary btn--full">Login</button>
    </form>

    <p class="auth-switch">
      Belum punya akun? <a href="{% url 'register' %}">Daftar sekarang</a>
    </p>
  </div>
</section>
{% endblock %}
