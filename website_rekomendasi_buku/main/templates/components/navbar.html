{% load static %}
<nav class="navbar">
  <a href="{% url 'home' %}" class="navbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    BookAI
  </a>

  <div class="navbar-links">
    <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
    <a href="{% url 'ai_search' %}" class="{% if request.resolver_match.url_name == 'ai_search' %}active{% endif %}">AI Search</a>
    <a href="{% url 'favorites' %}" class="{% if request.resolver_match.url_name == 'favorites' %}active{% endif %}">Favorites</a>
    <a href="{% url 'contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact & Feedback</a>
  </div>

  <div class="navbar-user">
    {% if user.is_authenticated %}
      <span class="username">{{ user.username }}</span>
      <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    {% else %}
      <a href="{% url 'login' %}" class="btn-nav-login">Login</a>
      <a href="{% url 'register' %}" class="btn-nav-register">Daftar</a>
    {% endif %}
    <button class="avatar-btn" aria-label="User">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
  </div>
</nav>
